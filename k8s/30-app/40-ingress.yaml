apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agri-ingress
  namespace: agri
spec:
  ingressClassName: traefik
  rules:
    - host: app.k3s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80