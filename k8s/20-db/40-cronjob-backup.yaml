apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: agri
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels: { app: agri, tier: backup }
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - pg_dump --clean --if-exists > /backup/dump-$(date +%Y%m%d-%H%M).sql && ls -l /backup
              env:
                - name: PGHOST
                  value: db
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: db-credentials, key: POSTGRES_USER }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD }
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef: { name: app-config, key: DB_NAME }
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 200m, memory: 256Mi }
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backup-pvc